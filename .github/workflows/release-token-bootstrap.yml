name: Release with npm token bootstrap

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish, for example 1.0.0 or v1.0.0
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-token-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm with one-time token
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Validate release ref
        run: |
          case "${{ github.ref }}" in
            refs/heads/v1.0.0|refs/heads/main|refs/tags/v*) ;;
            *)
              echo "Token bootstrap releases must run from branch v1.0.0, branch main, or a v* tag."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          REQUESTED_VERSION="${{ inputs.version }}"
          REQUESTED_VERSION="${REQUESTED_VERSION#v}"

          if [ "$PACKAGE_VERSION" != "$REQUESTED_VERSION" ]; then
            echo "package.json version $PACKAGE_VERSION does not match requested version ${{ inputs.version }}."
            exit 1
          fi

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
              echo "package.json version $PACKAGE_VERSION does not match tag $GITHUB_REF_NAME."
              exit 1
            fi
          fi

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test -- --runInBand

      - name: Check npm package contents
        run: |
          npm pack --dry-run --json > pack-dry-run.json
          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('pack-dry-run.json', 'utf8'))[0];
          const files = new Set(result.files.map((file) => file.path));
          const required = [
            'package.json',
            'README.md',
            'CHANGELOG.md',
            'CONTRIBUTING.md',
            'SECURITY.md',
            'LICENSE',
            'dist/index.js',
            'dist/index.d.ts',
          ];
          const missing = required.filter((file) => !files.has(file));
          if (missing.length > 0) {
            console.error(`Missing expected package files: ${missing.join(', ')}`);
            process.exit(1);
          }
          console.log(`Package ${result.name}@${result.version} contains ${result.files.length} files.`);
          NODE

      - name: Verify package is not already published
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published."
            exit 1
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
