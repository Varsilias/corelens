name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
      id-token: write
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Validate release tag
        run: |
          case "${GITHUB_REF_NAME}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Release tags must look like v1.2.3."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify trusted publishing toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify release metadata
        run: npm run release:check

      - name: Resolve release metadata
        id: release
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_NAME="v$PACKAGE_VERSION"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="$GITHUB_REF_NAME"
          fi

          {
            echo "package_name=$PACKAGE_NAME"
            echo "package_version=$PACKAGE_VERSION"
            echo "tag_name=$TAG_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test -- --runInBand

      - name: Check npm package contents
        run: |
          npm pack --dry-run --json > pack-dry-run.json
          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('pack-dry-run.json', 'utf8'))[0];
          const files = new Set(result.files.map((file) => file.path));
          const required = [
            'package.json',
            'README.md',
            'CHANGELOG.md',
            'CONTRIBUTING.md',
            'SECURITY.md',
            'LICENSE',
            'dist/index.js',
            'dist/index.d.ts',
          ];
          const missing = required.filter((file) => !files.has(file));
          if (missing.length > 0) {
            console.error(`Missing expected package files: ${missing.join(', ')}`);
            process.exit(1);
          }
          console.log(`Package ${result.name}@${result.version} contains ${result.files.length} files.`);
          NODE

      - name: Check npm publication status
        id: npm
        run: |
          if npm view "${{ steps.release.outputs.package_name }}@${{ steps.release.outputs.package_version }}" version >/dev/null 2>&1; then
            echo "${{ steps.release.outputs.package_name }}@${{ steps.release.outputs.package_version }} is already published. Skipping npm publish."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm.outputs.already_published != 'true'
        run: npm publish --access public --provenance

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.release.outputs.tag_name }}" >/dev/null 2>&1; then
            echo "GitHub release ${{ steps.release.outputs.tag_name }} already exists."
            exit 0
          fi

          gh release create "${{ steps.release.outputs.tag_name }}" \
            --target "$GITHUB_SHA" \
            --title "Corelens ${{ steps.release.outputs.tag_name }}" \
            --generate-notes
