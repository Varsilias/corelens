services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.151.0
    command: ['--config=/etc/otelcol/config.yaml']
    ports:
      - '4318:4318'
      - '13133:13133'
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
      - ./otel-output:/tmp/otel-output
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:13133/']
      interval: 2s
      timeout: 2s
      retries: 20
